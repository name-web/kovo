services:
  # ---------------- Le conteneur bd PostgreSQL -------------- -->
  db:
    image: postgres:18-alpine
    container_name: kovo-postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - kovo-network




  # ---------------- Le conteneur API NestJS -------------- -->
  api:
    build: .
    container_name: kovo-nestjs-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    networks:
      - kovo-network

networks:
  kovo-network:
    driver: bridge

volumes:
  postgres_data: