version: '3.8'

services:
  # ---------------- Le conteneur bd PostgreSQL -------------- -->
  db:
    image: postgres:18-alpine 
    container_name: kovo-postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=securepassword123
      - POSTGRES_DB=kovo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kovo-network




  # ---------------- Le conteneur API NestJS -------------- -->
  api:
    build: .
    container_name: kovo-nestjs-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:securepassword123@db:5432/kovo_db?schema=public
      - JWT_SECRET=super_secret_key_for_kovo_api_test
    depends_on:
      - db
    networks:
      - kovo-network

networks:
  kovo-network:
    driver: bridge

volumes:
  postgres_data:
